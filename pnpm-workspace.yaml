packages:
  - "apps/*"
  - "packages/*"

# サードパーティの .d.ts（例: @fullcalendar/react）は自身の位置から
# `import React from 'react'` を解決するため、@types/* が root の
# node_modules から辿れる必要がある。依存を各ワークスペースへ移した結果
# root から @types/* が消え、型解決に失敗したのでホイストを明示する。
publicHoistPattern:
  - '@types/*'

# いずれもプリビルドバイナリを使うため、ビルドスクリプトは不要
# （実行を許可しない方がサプライチェーン上安全）
allowBuilds:
  '@heroui/shared-utils': false
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@types/lodash@4.17.25'
  - '@upstash/redis@1.38.1'
  - '@turbo/darwin-64@2.10.8'
  - '@turbo/darwin-arm64@2.10.8'
  - '@turbo/linux-64@2.10.8'
  - '@turbo/linux-arm64@2.10.8'
  - '@turbo/windows-64@2.10.8'
  - '@turbo/windows-arm64@2.10.8'
  - eslint-config-turbo@2.10.8
  - eslint-plugin-turbo@2.10.8
  - turbo@2.10.8
  - '@types/luxon@3.7.3'
  - '@next/bundle-analyzer@16.3.0'
  - '@next/eslint-plugin-next@16.3.0'
  - eslint-config-next@16.3.0
  - swr@2.5.0
  - '@next/env@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - next@16.3.0
